# The contents of this file is based on https://github.com/home-assistant/core/blob/dev/pyproject.toml

target-version = "py314"

# The vendored device library is linted in its own repository.
extend-exclude = ["custom_components/e3dc/e3dc_ess_modbus"]

[lint]
select = [
    "ALL",
]

ignore = [
    "ANN401", # Dynamically typed expressions (typing.Any) are disallowed
    "D203", # no-blank-line-before-class (incompatible with formatter)
    "D212", # multi-line-summary-first-line (incompatible with formatter)
    "COM812", # incompatible with formatter
    "ISC001", # incompatible with formatter
]

[lint.flake8-pytest-style]
fixture-parentheses = false

[lint.pyupgrade]
keep-runtime-typing = true

[lint.mccabe]
max-complexity = 25

[lint.per-file-ignores]
# scripts/vendor.py copies these from the core integration, which follows
# core's narrower rule set.
"custom_components/e3dc/*" = [
    "ARG001", # Platform setup functions take hass whether they use it or not
    "ARG002",
    "D213", # Core puts a docstring's summary on its first line
    "D401",
    "E501",
    "FBT001",
    "FBT003",
    "PLR0913",
    "PLW2901",
    "S101",
    "TC001",
    "TC002",
    "TC003",
]
"tests/*" = [
    "ARG001", # Fixtures are requested for their side effects
    "ARG005",
    "D104",
    "D401",
    "FBT001",
    "FBT003",
    "PLR0913",
    "PLR2004",
    "S101",
    "TC002",
    "TC003",
]
